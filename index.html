<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA standalone mode redirect to Linker X app -->
    <script>
      (function() {
        // Force cleanup of obsolete service workers on initial load to resolve caching blocks
        if ('serviceWorker' in navigator && !sessionStorage.getItem('sw_cleared')) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            if (registrations.length > 0) {
              for (let registration of registrations) {
                registration.unregister();
              }
              // Clear caches associated with PWA
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  for (let name of names) caches.delete(name);
                });
              }
              sessionStorage.setItem('sw_cleared', 'true');
              window.location.reload();
            }
          });
        }

        function checkAndRedirect() {
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
            || window.navigator.standalone 
            || document.referrer.includes('android-app://')
            || new URLSearchParams(window.location.search).get('source') === 'pwa'
            || window.location.search.includes('source=pwa');

          if (isStandalone) {
            window.location.replace("https://linker-x-project.vercel.app/");
            return true;
          }
          return false;
        }

        // Run instantly
        if (!checkAndRedirect()) {
          // If not detected immediately due to browser window creation delay, poll for 1.5s
          let count = 0;
          const interval = setInterval(function() {
            count++;
            if (checkAndRedirect() || count > 30) {
              clearInterval(interval);
            }
          }, 50);
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Capture beforeinstallprompt early on window object
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        console.log('beforeinstallprompt event captured and saved globally');
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service worker registered:', reg.scope))
            .catch(err => console.error('Service worker registration failed:', err));
        });
      }
    </script>
